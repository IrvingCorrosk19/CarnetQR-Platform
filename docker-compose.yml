services:
  postgres:
    image: postgres:15
    container_name: carnetqr_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - carnetqr_postgres_data:/var/lib/postgresql/data
    # NO exponer puerto 5432 externamente para evitar conflictos con otras aplicaciones
    # Solo accesible desde la red interna carnetqr_net
    networks:
      - carnetqr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: carnetqr_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_DATAPROTECTION_PATH: /app/dataprotection-keys
    volumes:
      - carnetqr_dataprotection_keys:/app/dataprotection-keys
    # Puerto 8001 para evitar conflictos con otras aplicaciones y proxy reverso
    ports:
      - "8001:8080"
    networks:
      - carnetqr_net

volumes:
  carnetqr_postgres_data:
    name: carnetqr_postgres_data
  carnetqr_dataprotection_keys:
    name: carnetqr_dataprotection_keys

networks:
  carnetqr_net:
    name: carnetqr_net
    driver: bridge